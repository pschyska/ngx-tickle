[package]

name = "examples"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

[dependencies]
ngx-tickle = { path = ".." }

anyhow = "1.0"
async-compat = "0.2"
bytes = "1.10"
constcat = "0.6.1"
futures = "0.3"
futures-util = "0.3"
http = "1.4"
http-body = "1.0.1"
http-body-util = "0.1"
hyper = { version = "1.6.0", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
libc = "0.2"
nginx-sys = "0.5"
ngx = { version = "0.5.1", features = ["async", "serde", "std", "vendored"] }
pin-project-lite = "0.2.16"
reqwest = "0.13"
serde_json = "1.0.142"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0"
tokio = { version="1.52", features = ["rt-multi-thread", "time", "fs", "io-util"] }

[build-dependencies]
anyhow = "1.0"
cargo_metadata = "0.23"

[features]
selfpipe = ["ngx-tickle/selfpipe"]

[[example]]
name = "sidecar"
path = "sidecar.rs"
crate-type = ["cdylib"]

[[example]]
name = "compat"
path = "compat.rs"
crate-type = ["cdylib"]

[[example]]
name = "yielding"
path = "yielding.rs"
crate-type = ["cdylib"]

[[example]]
name = "benchmark"
path = "benchmark.rs"
crate-type = ["cdylib"]
